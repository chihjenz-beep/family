<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>上傳照片 · 家園維護記事</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="page-head">
  <h1>上傳照片</h1>
  <p>一次最多 10 張，AI 會建議區域分類與清潔項目</p>
</header>

<main>
  <label class="upload-box" for="file-input">
    點此選取照片（相機或相簿）<br />
    <span style="font-size:12.5px;">最多 10 張</span>
  </label>
  <input id="file-input" type="file" accept="image/*" multiple capture="environment" style="display:none;" />

  <div id="preview-grid" class="photo-grid"></div>

  <div style="margin-top:14px;">
    <button id="analyze-btn" class="primary" disabled>分析這些照片</button>
  </div>

  <div id="results" style="margin-top:20px;"></div>
</main>

<nav class="tabbar">
  <a href="index.html"><span class="icon">✓</span>待辦</a>
  <a href="upload.html" class="active"><span class="icon">＋</span>上傳</a>
  <a href="locations.html"><span class="icon">▦</span>空間</a>
  <a href="settings.html"><span class="icon">⚙</span>設定</a>
</nav>

<script type="module">
  import { ready, db } from "./js/firebase-init.js";
  import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const MAX_FILES = 10;
  const fileInput = document.getElementById("file-input");
  const previewGrid = document.getElementById("preview-grid");
  const analyzeBtn = document.getElementById("analyze-btn");
  const results = document.getElementById("results");

  let selectedFiles = [];
  let leafLocations = []; // {id, name}

  ready.then(async () => {
    const q = query(collection(db, "locations"), where("parentId", "!=", null));
    const snap = await getDocs(q);
    leafLocations = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  });

  fileInput.addEventListener("change", () => {
    const files = Array.from(fileInput.files).slice(0, MAX_FILES);
    if (fileInput.files.length > MAX_FILES) {
      alert(`最多只能選 ${MAX_FILES} 張，已自動取前 ${MAX_FILES} 張`);
    }
    selectedFiles = files;
    previewGrid.innerHTML = "";
    files.forEach((f) => {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(f);
      previewGrid.appendChild(img);
    });
    analyzeBtn.disabled = files.length === 0;
  });

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function locationOptionsHtml(selectedGuess) {
    const guessMatch = leafLocations.find((l) => l.name === selectedGuess);
    return leafLocations
      .map(
        (l) =>
          `<option value="${l.id}" ${guessMatch && guessMatch.id === l.id ? "selected" : ""}>${l.name}</option>`
      )
      .join("");
  }

  const cycleOptionsHtml = `
    <option value="weekly">每週</option>
    <option value="biweekly">每兩週</option>
    <option value="monthly">每月</option>
  `;

  analyzeBtn.addEventListener("click", async () => {
    if (!selectedFiles.length) return;
    analyzeBtn.disabled = true;
    analyzeBtn.textContent = "分析中…";
    results.innerHTML = "";

    const functions = getFunctions();
    const analyzePhoto = httpsCallable(functions, "analyzePhoto");
    const storage = getStorage();

    for (const file of selectedFiles) {
      const card = document.createElement("div");
      card.className = "suggestion-card";
      const previewUrl = URL.createObjectURL(file);
      card.innerHTML = `<img src="${previewUrl}" /><p style="color:var(--ink-soft);font-size:13px;">分析中…</p>`;
      results.appendChild(card);

      try {
        const base64 = await fileToBase64(file);

        // 同步上傳到 Storage，之後照片可在空間總覽/紀錄中回看
        const storageRef = ref(storage, `photos/${Date.now()}_${file.name}`);
        const uploadResult = await uploadBytes(storageRef, file);
        const storageUrl = await getDownloadURL(uploadResult.ref);

        const { data } = await analyzePhoto({
          imageBase64: base64,
          mediaType: file.type || "image/jpeg",
          storageUrl,
        });

        const s = data.suggestion || {};
        const items = s.items && s.items.length ? s.items : [""];

        card.innerHTML = `
          <img src="${previewUrl}" />
          <div class="chip-row">
            ${(s.items || []).map((i) => `<span class="chip">${i}</span>`).join("")}
          </div>
          <p style="font-size:13px;color:var(--ink-soft);">${s.notes || ""}</p>
          <label style="font-size:13px;">區域</label>
          <select class="loc-select">${locationOptionsHtml(s.locationGuess)}</select>
          <label style="font-size:13px;">清潔項目名稱</label>
          <input class="item-name" type="text" value="${items[0]}" />
          <label style="font-size:13px;">清潔週期</label>
          <select class="cycle-select">${cycleOptionsHtml}</select>
          <div class="card-actions">
            <button class="secondary skip-btn">略過</button>
            <button class="primary adopt-btn">採用，建立任務</button>
          </div>
        `;

        card.querySelector(".skip-btn").addEventListener("click", () => {
          card.remove();
        });

        card.querySelector(".adopt-btn").addEventListener("click", async () => {
          const locationId = card.querySelector(".loc-select").value;
          const itemName = card.querySelector(".item-name").value.trim();
          const cycle = card.querySelector(".cycle-select").value;
          if (!locationId || !itemName) {
            alert("請選擇區域並填寫項目名稱");
            return;
          }
          const confirmSuggestion = httpsCallable(functions, "confirmSuggestion");
          card.querySelector(".adopt-btn").textContent = "建立中…";
          try {
            await confirmSuggestion({ locationId, itemName, cycle, photoId: data.photoId });
            card.innerHTML = `<p style="color:var(--moss-deep);font-weight:700;">已建立「${itemName}」的清潔任務 ✓</p>`;
          } catch (e) {
            alert("建立失敗：" + e.message);
          }
        });
      } catch (e) {
        card.innerHTML = `<p style="color:var(--danger);font-size:13px;">分析失敗：${e.message}</p>`;
      }
    }

    analyzeBtn.disabled = false;
    analyzeBtn.textContent = "分析這些照片";
  });
</script>
</body>
</html>
