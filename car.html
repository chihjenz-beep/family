<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>平安家園公務車行車定位系統</title>
  
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: #ffffff;
      --admin-bg: #1e1e1e;
      --primary-blue: #3498db;
      --accent-orange: #e67e22;
      --text-main: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg-dark); min-height: 100vh; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 15px; }

    /* Top Bar */
    .top-bar { width: 100%; max-width: 1050px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
    .top-bar h2 { font-size: 1.2rem; white-space: nowrap; }
    .mode-btn { background-color: var(--primary-blue); color: white; border: none; padding: 8px 14px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .mode-btn:hover { opacity: 0.9; }

    /* Main Metro Display */
    .metro-display { width: 100%; max-width: 1050px; background-color: var(--panel-bg); border: 4px solid #333; border-radius: 8px; display: flex; flex-direction: row; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); color: var(--text-main); min-height: 270px; }
    
    .left-panel { width: 32%; min-width: 280px; background-color: #f8f9fa; border-right: 3px solid #ccc; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .line-info { display: flex; align-items: center; gap: 8px; }
    .line-badge { background-color: var(--accent-orange); color: white; font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 1.1rem; }
    .line-name { font-size: 0.95rem; font-weight: bold; color: #333; }
    
    .task-display-box { margin-top: 8px; }
    .task-label { font-size: 0.75rem; color: #666; display: block; margin-bottom: 2px; }
    .task-read-only { width: 100%; padding: 6px 10px; font-size: 0.95rem; font-weight: bold; color: #2c3e50; background-color: #e9ecef; border: 2px solid #bdc3c7; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }

    .next-station-box { margin-top: 8px; }
    .next-title { font-size: 0.8rem; color: #666; }
    .next-station-name { font-size: 1.6rem; font-weight: 900; color: #d35400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gps-dist-info { font-size: 0.75rem; color: var(--accent-orange); font-weight: bold; margin-top: 2px; }

    .bottom-info { display: flex; justify-content: space-between; align-items: center; background-color: #222; color: #fff; padding: 6px 12px; border-radius: 4px; font-family: monospace; font-size: 1.1rem; margin-top: 10px; }
    .car-num span { font-weight: bold; color: #ffca28; }

    /* Track Panel */
    .right-panel { width: 68%; background-color: #0b192c; position: relative; display: flex; flex-direction: column; justify-content: center; padding: 25px 20px; min-height: 220px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .track-container { position: relative; height: 120px; display: flex; align-items: center; min-width: 100%; }
    .track-line { position: absolute; width: 100%; height: 8px; background-color: #555; z-index: 1; top: 18px; }
    .track-progress { position: absolute; height: 8px; background-color: #f39c12; width: 0%; z-index: 2; transition: width 0.5s linear; top: 18px; }

    /* 箭頭動畫與容器設定 */
    .arrows-wrapper { position: absolute; width: 100%; display: flex; justify-content: space-between; z-index: 2; padding: 0 20px; top: 12px; pointer-events: none; }
    .segment-arrow { color: #34495e; font-size: 1rem; font-weight: 900; transition: color 0.3s; line-height: 1; letter-spacing: -1px; display: inline-block; }
    .segment-arrow.active { 
      color: #00d2d3; 
      text-shadow: 0 0 10px #00d2d3; 
      animation: arrowFlow 0.8s infinite linear; 
    }

    @keyframes arrowFlow {
      0% { opacity: 0.2; transform: translateX(-4px); }
      50% { opacity: 1; transform: translateX(2px); }
      100% { opacity: 0.2; transform: translateX(6px); }
    }

    .stations-wrapper { position: absolute; width: 100%; display: flex; justify-content: space-between; z-index: 3; top: 12px; }
    .station-node { display: flex; flex-direction: column; align-items: center; position: relative; flex-shrink: 0; min-width: 70px; max-width: 90px; }
    .station-circle { width: 14px; height: 14px; background-color: #fff; border: 3px solid var(--accent-orange); border-radius: 50%; transition: all 0.3s; flex-shrink: 0; }
    .station-node.active .station-circle { background-color: #e74c3c; border-color: #fff; box-shadow: 0 0 10px #e74c3c; }
    .station-node.passed .station-circle { background-color: #7f8c8d; border-color: #4a5568; }
    
    /* 站名換行與邊界控制 */
    .station-name { 
      margin-top: 8px; 
      color: #fff; 
      font-weight: bold; 
      font-size: 0.75rem; 
      white-space: normal; 
      word-wrap: break-word; 
      word-break: break-all; 
      text-align: center; 
      line-height: 1.25; 
      max-width: 80px; 
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .station-code { font-size: 0.65rem; color: #aaa; margin-top: 3px; }

    .train-icon { position: absolute; top: -10px; left: 0%; transform: translateX(-50%); font-size: 1.3rem; transition: left 0.5s linear; z-index: 4; }
    .status-banner { position: relative; margin-top: 20px; text-align: center; background-color: rgba(255, 255, 255, 0.1); color: #f1c40f; padding: 6px; border-radius: 4px; font-size: 0.85rem; }
    .completed-banner { background-color: #27ae60 !important; color: #fff !important; font-weight: bold; }

    /* Admin Panel */
    .admin-panel { width: 100%; max-width: 1050px; background-color: var(--admin-bg); border: 2px solid #444; border-radius: 8px; padding: 15px; display: none; margin-top: 10px; }
    .admin-title { font-size: 1.1rem; font-weight: bold; color: var(--primary-blue); margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
    
    .duty-card { background-color: #2c3e50; padding: 12px; border-radius: 6px; margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    .duty-status-badge { padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
    .duty-off { background-color: #e74c3c; color: #fff; }
    .duty-on { background-color: #2ecc71; color: #fff; }
    
    .duty-btn { padding: 8px 16px; font-size: 0.9rem; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    .btn-start-duty { background-color: #27ae60; color: white; }
    .btn-stop-duty { background-color: #c0392b; color: white; }

    .admin-select { padding: 8px 12px; font-size: 0.95rem; font-weight: bold; color: #000000 !important; background-color: #ffffff !important; border: 2px solid var(--primary-blue); border-radius: 4px; outline: none; margin-bottom: 10px; width: 100%; max-width: 350px; cursor: pointer; }
    .admin-select option { color: #000000 !important; background-color: #ffffff !important; font-weight: bold; }
    
    .table-responsive { width: 100%; overflow-x: auto; }
    .gps-table { width: 100%; min-width: 600px; border-collapse: collapse; margin-top: 10px; color: #fff; }
    .gps-table th, .gps-table td { border: 1px solid #444; padding: 6px; text-align: center; font-size: 0.8rem; }
    .gps-table th { background-color: #2c3e50; }
    .gps-input { width: 100%; background-color: #2a2a2a; border: 1px solid #555; color: #fff; padding: 4px; border-radius: 3px; text-align: center; }

    @media (max-width: 768px) {
      .metro-display { flex-direction: column; }
      .left-panel { width: 100%; border-right: none; border-bottom: 3px solid #ccc; }
      .right-panel { width: 100%; min-height: 200px; padding: 20px 15px; }
      .station-name { font-size: 0.7rem; max-width: 70px; }
      .segment-arrow { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>平安家園公務車行車定位系統</h2>
    <button class="mode-btn" id="btn-toggle-admin">🔧 控制後台 / 駕駛員設定</button>
  </div>

  <div class="metro-display" id="frontend-display">
    <div class="left-panel">
      <div>
        <div class="line-info">
          <span class="line-badge">DB03</span>
          <span class="line-name">平安家園多元關懷</span>
        </div>
        
        <div class="task-display-box">
          <span class="task-label">目前執行任務：</span>
          <div class="task-read-only">
            <span id="current-task-name">接送長輩</span>
            <span style="font-size: 0.75rem; color: #7f8c8d;">雲端同步</span>
          </div>
        </div>

        <div class="next-station-box">
          <div class="next-title" id="status-title">下一站 Next Stop</div>
          <div class="next-station-name" id="target-station">--</div>
          <div class="gps-dist-info" id="gps-dist-text">正在讀取雲端資料...</div>
        </div>
      </div>

      <div class="bottom-info">
        <span id="current-time">00:00</span>
        <div class="car-num">車號 <span>DB03</span></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="track-container" id="track-container">
        <div class="track-line"></div>
        <div class="track-progress" id="progress-bar"></div>
        <div class="arrows-wrapper" id="arrows-container"></div>
        <div class="train-icon" id="train">🚐</div>
        <div class="stations-wrapper" id="stations-container"></div>
      </div>
      <div class="status-banner" id="status-text">連線中...</div>
    </div>
  </div>

  <div class="admin-panel" id="admin-panel">
    <div class="admin-title">📱 駕駛員出勤定位發射器 (請於手機開啟)</div>
    
    <div class="duty-card">
      <div>
        <span style="font-size:0.85rem; color:#aaa;">當前廣播狀態：</span>
        <span id="duty-badge" class="duty-status-badge duty-off">未出勤 (定位關閉)</span>
        <p id="driver-coords-info" style="font-size: 0.8rem; color: #3498db; margin-top: 5px;">即時座標：--</p>
      </div>
      <div>
        <button id="btn-duty-toggle" class="duty-btn btn-start-duty">▶️ 開始出勤 (啟動手機 GPS 廣播)</button>
      </div>
    </div>

    <div class="admin-title" style="margin-top:15px;">⚙️ 任務路線切換與電子圍欄設定</div>
    <label style="font-size:0.85rem; font-weight:bold; display:block; margin-bottom:5px;">選擇全車隊目前執行任務：</label>
    <select id="admin-task-select" class="admin-select"></select>

    <div class="table-responsive">
      <table class="gps-table">
        <thead>
          <tr>
            <th>站序</th>
            <th>站點名稱</th>
            <th>緯度 (Latitude)</th>
            <th>經度 (Longitude)</th>
            <th>到站圍欄 (公尺)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="admin-gps-tbody"></tbody>
      </table>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
      <button id="btn-add-station" class="duty-btn" style="background-color:#2980b9; color:#fff; font-size:0.85rem;">➕ 新增站點</button>
      <button id="btn-toggle-import" class="duty-btn" style="background-color:#8e44ad; color:#fff; font-size:0.85rem;">📋 從試算表匯入</button>
      <button id="btn-save-task" class="duty-btn btn-start-duty" style="font-size:0.85rem;">💾 儲存修改並同步至雲端</button>
    </div>

    <div id="import-panel" style="display:none; margin-top:12px; background-color:#2c3e50; padding:12px; border-radius:6px;">
      <p style="font-size:0.75rem; color:#bbb; margin-bottom:8px; line-height:1.5;">
        到 Google 試算表選取「站名、緯度、經度、圍欄(公尺)」這四欄資料（不含標題列），直接複製後貼在下方，再按「解析並匯入」。也支援逗號分隔的 CSV 格式。
      </p>
      <textarea id="import-textarea" rows="6" style="width:100%; background-color:#2a2a2a; color:#fff; border:1px solid #555; border-radius:4px; padding:8px; font-family:monospace; font-size:0.8rem;" placeholder="江山里	23.4500	120.2400	50&#10;振寮里	23.4530	120.2430	50"></textarea>
      <div style="display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;">
        <button id="btn-parse-import" class="duty-btn btn-start-duty" style="font-size:0.8rem;">✅ 解析並匯入（取代目前站點）</button>
        <button id="btn-parse-import-append" class="duty-btn" style="background-color:#16a085; color:#fff; font-size:0.8rem;">➕ 解析並附加到目前站點</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBTX7owI7jfp_oyIHkMLT5GK-I-YLY_tyc",
      authDomain: "db03gps.firebaseapp.com",
      databaseURL: "https://db03gps-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "db03gps",
      storageBucket: "db03gps.firebasestorage.app",
      messagingSenderId: "847861047398",
      appId: "1:847861047398:web:4320e6628a8e5d54018da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const busRef = ref(db, 'bus_DB03');
    const locationRef = ref(db, 'bus_DB03/location');

    const defaultTasks = {
      elder: {
        name: "接送長輩",
        icon: "🚐",
        stations: [
          { name: "診所發車", lat: 23.4601, lng: 120.2501, radius: 50 },
          { name: "興中里",   lat: 23.4620, lng: 120.2530, radius: 50 },
          { name: "岱江里",   lat: 23.4645, lng: 120.2560, radius: 50 },
          { name: "岑海里",   lat: 23.4670, lng: 120.2590, radius: 50 },
          { name: "振寮里",   lat: 23.4695, lng: 120.2620, radius: 50 },
          { name: "新厝里",   lat: 23.4720, lng: 120.2650, radius: 50 }
        ]
      },
      bento: {
        name: "便當配送",
        icon: "🍱",
        stations: [
          { name: "江山里", lat: 23.4500, lng: 120.2400, radius: 50 },
          { name: "振寮里", lat: 23.4530, lng: 120.2430, radius: 50 },
          { name: "永安里", lat: 23.4560, lng: 120.2460, radius: 50 },
          { name: "興中里", lat: 23.4590, lng: 120.2490, radius: 50 },
          { name: "岱江里", lat: 23.4620, lng: 120.2520, radius: 50 },
          { name: "岑海里", lat: 23.4650, lng: 120.2550, radius: 50 },
          { name: "新岑里", lat: 23.4680, lng: 120.2580, radius: 50 },
          { name: "復興里", lat: 23.4710, lng: 120.2610, radius: 50 },
          { name: "新店村", lat: 23.4740, lng: 120.2640, radius: 50 },
          { name: "官和村", lat: 23.4770, lng: 120.2670, radius: 50 }
        ]
      }
    };

    let taskDatabase = defaultTasks;
    let currentTaskKey = "elder";
    let currentStationIndex = 0;
    let isArrivedState = false;
    let isDutyOn = false;
    let watchPositionId = null;
    let wakeLock = null;
    let currentRealCoords = { lat: 0, lng: 0 };

    const adminTaskSelect = document.getElementById("admin-task-select");
    const currentTaskNameEl = document.getElementById("current-task-name");
    const trainEl = document.getElementById("train");
    const progressBar = document.getElementById("progress-bar");
    const targetStationEl = document.getElementById("target-station");
    const statusTitleEl = document.getElementById("status-title");
    const statusTextEl = document.getElementById("status-text");
    const gpsDistText = document.getElementById("gps-dist-text");
    const stationsContainer = document.getElementById("stations-container");
    const arrowsContainer = document.getElementById("arrows-container");
    const trackContainer = document.getElementById("track-container");

    function calculateDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;
      const R = 6371e3;
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δφ = (lat2 - lat1) * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function renderTaskSelectOptions() {
      adminTaskSelect.innerHTML = "";
      for (let key in taskDatabase) {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = taskDatabase[key].name;
        adminTaskSelect.appendChild(option);
      }
      adminTaskSelect.value = currentTaskKey;
    }

    function handleDataUpdate(data) {
      if (!data) return;

      if (data.currentTaskKey && data.currentTaskKey !== currentTaskKey) {
        currentTaskKey = data.currentTaskKey;
        currentStationIndex = 0;
        isArrivedState = false;
      }

      if (data.taskDatabase) {
        taskDatabase = data.taskDatabase;
      }

      renderTaskSelectOptions();
      buildFrontendUI();
      updateDisplayUI();
    }

    onValue(locationRef, (snapshot) => {
      if (snapshot.exists()) {
        const locData = snapshot.val();
        if (locData.lat && locData.lng) {
          currentRealCoords.lat = locData.lat;
          currentRealCoords.lng = locData.lng;
        }
        isDutyOn = locData.isDutyOn || false;

        const coordsEl = document.getElementById("driver-coords-info");
        if (coordsEl && currentRealCoords.lat !== 0) {
          coordsEl.textContent = `雲端座標：Lat ${currentRealCoords.lat.toFixed(5)}, Lng ${currentRealCoords.lng.toFixed(5)}`;
        }
        
        updateDutyUI(isDutyOn);
        updateDisplayUI();
      }
    });

    onValue(busRef, (snapshot) => {
      if (snapshot.exists()) {
        handleDataUpdate(snapshot.val());
      }
    });

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("Wake Lock 失敗:", err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    document.getElementById("btn-duty-toggle").addEventListener("click", () => {
      if (!isDutyOn) {
        if ("geolocation" in navigator) {
          requestWakeLock();
          statusTextEl.textContent = "正在搜尋 GPS 衛星訊號...";
          
          watchPositionId = navigator.geolocation.watchPosition(
            (position) => {
              if (!isDutyOn) return;

              const lat = position.coords.latitude;
              const lng = position.coords.longitude;
              
              currentRealCoords.lat = lat;
              currentRealCoords.lng = lng;

              const coordsEl = document.getElementById("driver-coords-info");
              if (coordsEl) {
                coordsEl.textContent = `即時座標：Lat ${lat.toFixed(5)}, Lng ${lng.toFixed(5)}`;
              }
              
              update(locationRef, {
                lat: lat,
                lng: lng,
                isDutyOn: true,
                timestamp: Date.now()
              });
            },
            (error) => {
              let msg = "";
              switch(error.code) {
                case error.PERMISSION_DENIED: msg = "使用者拒絕提供定位權限。"; break;
                case error.POSITION_UNAVAILABLE: msg = "無法取得位置資訊（請至戶外或開窗處）。"; break;
                case error.TIMEOUT: msg = "取得定位逾時，請重新再試。"; break;
                default: msg = error.message; break;
              }
              alert(`GPS 錯誤 (${error.code}): ${msg}`);
              updateDutyUI(false);
              isDutyOn = false;
            },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
          );
          
          isDutyOn = true;
          updateDutyUI(true);
        } else {
          alert("此裝置不支援 Geolocation API");
        }
      } else {
        if (watchPositionId !== null) navigator.geolocation.clearWatch(watchPositionId);
        releaseWakeLock();
        isDutyOn = false;
        update(locationRef, { isDutyOn: false });
        updateDutyUI(false);
      }
    });

    function updateDutyUI(status) {
      const dutyBadge = document.getElementById("duty-badge");
      const dutyBtn = document.getElementById("btn-duty-toggle");
      if (status) {
        dutyBadge.textContent = "🟢 正在對全網廣播 GPS 定位";
        dutyBadge.className = "duty-status-badge duty-on";
        dutyBtn.textContent = "⏸️ 停止廣播 / 下班";
        dutyBtn.className = "duty-btn btn-stop-duty";
      } else {
        dutyBadge.textContent = "未出勤 (定位關閉)";
        dutyBadge.className = "duty-status-badge duty-off";
        dutyBtn.textContent = "▶️ 開始出勤 (啟動手機 GPS 廣播)";
        dutyBtn.className = "duty-btn btn-start-duty";
      }
    }

    function buildFrontendUI() {
      const task = taskDatabase[currentTaskKey] || taskDatabase["elder"];
      if (!task) return;
      const stations = task.stations;
      const total = stations.length;

      /* 保留足夠單站寬度 (每站 90px)，站名長時可自動換行但不擠壓 */
      const minStationWidth = 90;
      const calculatedWidth = total * minStationWidth;
      trackContainer.style.minWidth = calculatedWidth > 0 ? `${calculatedWidth}px` : "100%";

      currentTaskNameEl.textContent = task.name;
      trainEl.textContent = task.icon || "🚐";
      stationsContainer.innerHTML = "";
      arrowsContainer.innerHTML = "";

      stations.forEach((st, idx) => {
        const stNode = document.createElement("div");
        stNode.className = "station-node";
        stNode.id = `st-${idx}`;
        stNode.innerHTML = `<div class="station-circle"></div><div class="station-name" title="${st.name}">${st.name}</div><div class="station-code">${String(idx+1).padStart(2,'0')}</div>`;
        stationsContainer.appendChild(stNode);
      });

      /* 建立站點之間的 >> 符號 */
      for (let i = 0; i < total - 1; i++) {
        const arrow = document.createElement("span");
        arrow.className = "segment-arrow";
        arrow.id = `arrow-${i}`;
        arrow.innerHTML = "&gt;&gt;";
        arrowsContainer.appendChild(arrow);
      }
    }

    function updateDisplayUI() {
      const task = taskDatabase[currentTaskKey] || taskDatabase["elder"];
      if (!task) return;
      const stations = task.stations;
      const total = stations.length;

      if (currentStationIndex >= total) currentStationIndex = 0;

      if (!isDutyOn) {
        gpsDistText.textContent = "廣播狀態: 駕駛員未開班";
        statusTextEl.textContent = "等待駕駛員開啟 GPS 廣播...";
        progressBar.style.width = "0%";
        trainEl.style.left = "0%";
        
        targetStationEl.textContent = stations[0] ? stations[0].name : "--";
        statusTitleEl.textContent = "首站 Starting Point";
        return;
      }

      const targetSt = stations[currentStationIndex];
      const dist = calculateDistance(currentRealCoords.lat, currentRealCoords.lng, targetSt.lat, targetSt.lng);

      if (dist <= targetSt.radius) isArrivedState = true;

      let posPercentage = 0;
      if (currentStationIndex > 0) {
        const prevPos = ((currentStationIndex - 1) / (total - 1)) * 100;
        const curPos = (currentStationIndex / (total - 1)) * 100;
        posPercentage = isArrivedState ? curPos : prevPos + (curPos - prevPos) * 0.5;
      }

      trainEl.style.left = posPercentage + "%";
      progressBar.style.width = posPercentage + "%";

      if (currentStationIndex === total - 1 && isArrivedState) {
        targetStationEl.textContent = "任務完成";
        statusTitleEl.textContent = "狀態 Status";
        statusTextEl.textContent = `✔ 本班次 ${task.name} 順利完成！`;
        statusTextEl.classList.add("completed-banner");
        gpsDistText.textContent = `已抵達終點站 (${targetSt.name})`;
      } else if (isArrivedState) {
        targetStationEl.textContent = targetSt.name;
        statusTitleEl.textContent = "本站 Current Stop";
        statusTextEl.textContent = `已進入 ${targetSt.name} 電子圍欄`;
        statusTextEl.classList.remove("completed-banner");
        gpsDistText.textContent = `距離站點: ${dist}m (進入 ${targetSt.radius}m 圍欄)`;
      } else {
        targetStationEl.textContent = targetSt.name;
        statusTitleEl.textContent = "下一站 Next Stop";
        statusTextEl.textContent = `前往 ${targetSt.name} 中...`;
        statusTextEl.classList.remove("completed-banner");
        gpsDistText.textContent = `距離下一站: ${dist}m`;
      }

      /* 箭頭動畫觸發邏輯 */
      for (let i = 0; i < total - 1; i++) {
        const arrowEl = document.getElementById(`arrow-${i}`);
        if (arrowEl) arrowEl.classList.toggle("active", !isArrivedState && i === currentStationIndex - 1);
      }

      for (let i = 0; i < total; i++) {
        const stNode = document.getElementById(`st-${i}`);
        if (stNode) {
          stNode.classList.remove("active", "passed", "blink");
          if (i < currentStationIndex || (i === currentStationIndex && isArrivedState)) stNode.classList.add("passed");
          else if (i === currentStationIndex) {
            stNode.classList.add("active");
            if (!isArrivedState) stNode.classList.add("blink");
          }
        }
      }
    }

    document.getElementById("btn-toggle-admin").addEventListener("click", () => {
      const panel = document.getElementById("admin-panel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
      if (panel.style.display === "block") {
        renderTaskSelectOptions();
        loadAdminTaskData();
      }
    });

    adminTaskSelect.addEventListener("change", () => {
      const selectedKey = adminTaskSelect.value;
      currentTaskKey = selectedKey;
      currentStationIndex = 0;
      isArrivedState = false;

      update(busRef, { currentTaskKey: selectedKey });

      buildFrontendUI();
      updateDisplayUI();
      loadAdminTaskData();
    });

    function loadAdminTaskData() {
      const selectedKey = adminTaskSelect.value || "elder";
      const stations = (taskDatabase[selectedKey] || defaultTasks["elder"]).stations;
      const tbody = document.getElementById("admin-gps-tbody");
      tbody.innerHTML = "";

      stations.forEach((st) => appendStationRow(st));
    }

    function appendStationRow(st) {
      const tbody = document.getElementById("admin-gps-tbody");
      const tr = document.createElement("tr");
      const name = st ? st.name : "";
      const lat = st ? st.lat : "";
      const lng = st ? st.lng : "";
      const radius = st ? st.radius : 50;

      tr.innerHTML = `
        <td class="st-order">${tbody.children.length + 1}</td>
        <td><input class="gps-input st-name" type="text" value="${name}"></td>
        <td><input class="gps-input st-lat" type="number" step="0.0001" value="${lat}"></td>
        <td><input class="gps-input st-lng" type="number" step="0.0001" value="${lng}"></td>
        <td><input class="gps-input st-rad" type="number" value="${radius}"></td>
        <td><button type="button" class="duty-btn btn-stop-duty btn-del-station" style="padding:4px 10px; font-size:0.8rem;">🗑 刪除</button></td>
      `;

      tr.querySelector(".btn-del-station").addEventListener("click", () => {
        if (document.querySelectorAll("#admin-gps-tbody tr").length <= 1) {
          alert("至少要保留一個站點。");
          return;
        }
        tr.remove();
        renumberStationRows();
      });

      tbody.appendChild(tr);
    }

    function renumberStationRows() {
      document.querySelectorAll("#admin-gps-tbody tr").forEach((tr, idx) => {
        tr.querySelector(".st-order").textContent = idx + 1;
      });
    }

    document.getElementById("btn-add-station").addEventListener("click", () => {
      appendStationRow(null);
      renumberStationRows();
    });

    document.getElementById("btn-toggle-import").addEventListener("click", () => {
      const panel = document.getElementById("import-panel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    });

    function parseStationText(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const stations = [];
      const errors = [];

      lines.forEach((line, i) => {
        const cells = line.includes("\t") ? line.split("\t") : line.split(",");
        const cleaned = cells.map(c => c.trim().replace(/^"|"$/g, ""));

        if (cleaned.length < 4) {
          errors.push(`第 ${i + 1} 行欄位不足 4 欄，已略過：${line}`);
          return;
        }

        const [name, latStr, lngStr, radStr] = cleaned;
        const lat = parseFloat(latStr);
        const lng = parseFloat(lngStr);
        const radius = parseInt(radStr);

        if (isNaN(lat) || isNaN(lng)) {
          if (i === 0) return;
          errors.push(`第 ${i + 1} 行緯度/經度不是數字，已略過：${line}`);
          return;
        }

        stations.push({
          name: name || `站點${stations.length + 1}`,
          lat,
          lng,
          radius: isNaN(radius) ? 50 : radius
        });
      });

      return { stations, errors };
    }

    function handleImport(append) {
      const text = document.getElementById("import-textarea").value;
      if (!text.trim()) {
        alert("請先貼上資料再匯入。");
        return;
      }

      const { stations, errors } = parseStationText(text);

      if (stations.length === 0) {
        alert("沒有解析到任何有效的站點資料，請確認格式為：站名、緯度、經度、圍欄(公尺)，以 Tab 或逗號分隔。");
        return;
      }

      if (!append) {
        document.getElementById("admin-gps-tbody").innerHTML = "";
      }

      stations.forEach(st => appendStationRow(st));
      renumberStationRows();

      let msg = `已匯入 ${stations.length} 個站點。`;
      if (errors.length > 0) {
        msg += `\n\n有 ${errors.length} 行被略過：\n` + errors.slice(0, 5).join("\n");
        if (errors.length > 5) msg += `\n...（還有 ${errors.length - 5} 行）`;
      }
      alert(msg);

      document.getElementById("import-textarea").value = "";
      document.getElementById("import-panel").style.display = "none";
    }

    document.getElementById("btn-parse-import").addEventListener("click", () => handleImport(false));
    document.getElementById("btn-parse-import-append").addEventListener("click", () => handleImport(true));

    document.getElementById("btn-save-task").addEventListener("click", () => {
      const selectedKey = adminTaskSelect.value || "elder";
      const task = taskDatabase[selectedKey] || defaultTasks[selectedKey];

      const rows = document.querySelectorAll("#admin-gps-tbody tr");
      const newStations = [];
      let hasError = false;

      rows.forEach((tr) => {
        const name = tr.querySelector(".st-name").value.trim();
        const lat = parseFloat(tr.querySelector(".st-lat").value);
        const lng = parseFloat(tr.querySelector(".st-lng").value);
        const radius = parseInt(tr.querySelector(".st-rad").value);

        if (!name || isNaN(lat) || isNaN(lng) || isNaN(radius)) {
          hasError = true;
          return;
        }
        newStations.push({ name, lat, lng, radius });
      });

      if (hasError || newStations.length === 0) {
        alert("請確認每一站的名稱、經緯度、圍欄數值都已正確填寫，不可留空。");
        return;
      }

      task.stations = newStations;

      update(busRef, {
        currentTaskKey: selectedKey,
        taskDatabase: taskDatabase
      });

      alert(`設定已成功寫入 Firebase 雲端！任務：${task.name}，共 ${newStations.length} 站。`);
    });

    setInterval(() => {
      const now = new Date();
      document.getElementById("current-time").textContent = 
        `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    }, 1000);
  </script>
</body>
</html>
